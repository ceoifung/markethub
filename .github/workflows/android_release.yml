name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=v$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=markethub-$APP_VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Verify git tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.tag_version }}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match pubspec version ${{ steps.version.outputs.tag_version }}"
            exit 1
          fi

      - name: Restore Android signing files
        shell: bash
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build signed release APK
        run: >
          flutter build apk --release
          --dart-define=REMOTE_BASE_URL=${{ secrets.REMOTE_BASE_URL }}
          --dart-define=GITHUB_REPOSITORY=${{ github.repository }}

      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}

      # 版本清单: App更新检测通过固定地址 releases/latest/download/version.yaml 读取,
      # 不依赖 api.github.com(国内不稳/匿名限流); 也可手动拷到自有后端静态目录(优先级最高)
      - name: Generate version manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag_version }}"
          APK="${{ steps.version.outputs.apk_name }}"
          TAG_ENC=$(printf '%s' "$TAG" | sed 's/+/%2B/g')
          APK_ENC=$(printf '%s' "$APK" | sed 's/+/%2B/g')
          cat > version.yaml <<EOF
          version: ${{ steps.version.outputs.app_version }}
          tag: $TAG
          apkUrl: https://github.com/${{ github.repository }}/releases/download/$TAG_ENC/$APK_ENC
          releaseUrl: https://github.com/${{ github.repository }}/releases/tag/$TAG_ENC
          date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat version.yaml

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/${{ steps.version.outputs.apk_name }}
            version.yaml
